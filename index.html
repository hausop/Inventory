<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="簡潔、RWD 的倉庫管理 PWA">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <title>倉管系統</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="倉管系統首頁">
      <span class="brand-mark">W</span>
      <span>倉管系統</span>
    </a>
    <div class="top-actions">
      <a class="icon-button" href="admin.html" title="管理員">⚙</a>
      <button id="randomButton" class="primary-button" type="button">🎲 隨機搭配</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow">WAREHOUSE</p>
        <h1>商品庫存</h1>
        <p class="muted">快速查看商品、分類與目前庫存。</p>
      </div>
      <div class="summary-card">
        <strong id="productCount">—</strong>
        <span>項商品</span>
      </div>
    </section>

    <section class="toolbar">
      <label class="search-box">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="搜尋商品名稱、分類..." autocomplete="off">
      </label>
      <select id="categoryFilter" class="select">
        <option value="">全部分類</option>
      </select>
    </section>

    <section>
      <div class="section-heading">
        <div>
          <h2>快速篩選</h2>
          <p class="muted">標籤只代表該商品的細分屬性。</p>
        </div>
      </div>
      <div id="tagFilters" class="chips"></div>
    </section>

    <section class="section-gap">
      <div class="section-heading">
        <div>
          <h2>商品</h2>
          <p id="resultText" class="muted">載入中...</p>
        </div>
      </div>
      <div id="productGrid" class="product-grid"></div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">⌕</div>
        <h3>找不到商品</h3>
        <p>請換一個搜尋條件或標籤。</p>
      </div>
    </section>
  </main>

  <dialog id="randomDialog" class="dialog">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">RANDOM SET</p>
        <h2>🎲 隨機搭配</h2>
      </div>
      <button class="icon-button" data-close-dialog type="button">×</button>
    </div>
    <div class="random-options">
      <label>抽取數量
        <select id="randomCount" class="select">
          <option value="2">2 個</option>
          <option value="3" selected>3 個</option>
          <option value="4">4 個</option>
        </select>
      </label>
      <label>分類
        <select id="randomCategory" class="select">
          <option value="">不限</option>
        </select>
      </label>
      <label>標籤
        <select id="randomTag" class="select">
          <option value="">不限</option>
        </select>
      </label>
    </div>
    <div id="randomResults" class="random-results"></div>
    <button id="rerollButton" class="primary-button full-width" type="button">🎲 再抽一次</button>
  </dialog>

  <nav class="mobile-nav" aria-label="主要導覽">
    <a class="active" href="index.html"><span>⌂</span>首頁</a>
    <a href="admin.html"><span>▦</span>管理</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/random.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
