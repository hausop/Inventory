<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f6f7f9"
  >

  <meta
    name="description"
    content="商品詳細資料與庫存紀錄"
  >

  <link
    rel="icon"
    href="assets/icon.svg"
    type="image/svg+xml"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

  <title>商品詳細｜倉管系統</title>
</head>


<body>

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
      aria-label="倉管系統首頁"
    >
      <span class="brand-mark">W</span>
      <span>倉管系統</span>
    </a>

    <div class="top-actions">

      <a
        class="secondary-button"
        href="index.html"
      >
        ← 商品
      </a>

      <a
        class="icon-button"
        href="admin.html"
        title="管理員"
      >
        ⚙
      </a>

    </div>

  </header>


  <main class="container product-detail-container">

    <!-- 載入狀態 -->

    <section
      id="productLoading"
      class="panel"
    >
      <p class="muted">
        商品資料載入中...
      </p>
    </section>


    <!-- 錯誤狀態 -->

    <section
      id="productError"
      class="panel hidden"
    >
      <h2>找不到商品</h2>

      <p
        id="productErrorMessage"
        class="muted"
      >
        無法載入商品資料。
      </p>

      <a
        class="primary-button"
        href="index.html"
      >
        返回商品列表
      </a>

    </section>


    <!-- 商品內容 -->

    <div
      id="productContent"
      class="hidden"
    >

      <!-- 商品基本資料 -->

      <section class="product-detail-hero">

  <div class="product-detail-image">

    <img
      id="productImage"
      src="assets/product-placeholder.svg"
      alt=""
    >

    <!-- 編輯模式才顯示 -->
    <div
      id="editImageField"
      class="inline-edit-field hidden"
    >
      <label for="editProductImageUrl">
        商品圖片網址
      </label>

      <input
        id="editProductImageUrl"
        type="url"
        placeholder="https://..."
      >
    </div>

  </div>


  <div class="product-detail-info">

    <!-- 商品名稱 -->
    <div
      id="productNameDisplay"
      class="product-display-field"
    >
      <p
        id="productCategory"
        class="eyebrow"
      >
        商品
      </p>

      <h1 id="productName">
        —
      </h1>
    </div>


    <!-- 編輯模式 -->
    <div
      id="productEditFields"
      class="product-edit-fields hidden"
    >

      <label class="inline-edit-field">
        <span>商品名稱</span>

        <input
          id="editProductName"
          type="text"
          required
        >
      </label>


      <div class="inline-edit-grid">

        <label class="inline-edit-field">
          <span>分類</span>

          <input
            id="editProductCategory"
            type="text"
            required
          >
        </label>


        <label class="inline-edit-field">
          <span>細分類</span>

          <input
            id="editProductSubcategory"
            type="text"
            required
          >
        </label>

      </div>


      <label class="inline-edit-field">
        <span>單位</span>

        <input
          id="editProductUnit"
          type="text"
          required
        >
      </label>


      <label class="inline-edit-field">
        <span>標籤</span>

        <input
          id="editProductTags"
          type="text"
          placeholder="例如：辦公用品, 常用品"
        >

        <small>
          多個標籤請使用逗號分隔。
        </small>
      </label>

    </div>


    <!-- 一般顯示模式 -->
    <div
      id="productNormalInfo"
    >

      <p
        id="productSubcategory"
        class="muted"
      >
        —
      </p>


      <div class="product-detail-stock">

        <span class="muted">
          目前庫存
        </span>

        <strong id="productStock">
          —
        </strong>

        <span id="productUnit">
          —
        </span>

      </div>


      <div
        id="productTags"
        class="product-tags"
      >
      </div>

    </div>


    <!-- 編輯模式操作列 -->
    <div
      id="inlineEditActions"
      class="inline-edit-actions hidden"
    >

      <button
        id="cancelInlineEditButton"
        class="secondary-button"
        type="button"
      >
        取消
      </button>

      <button
        id="saveInlineEditButton"
        class="primary-button"
        type="button"
      >
        儲存修改
      </button>

    </div>

  </div>

</section>


      <!-- 操作區 -->

      <section class="panel">

  <div class="panel-heading">

    <div>

      <h2>
        商品操作
      </h2>

      <p class="muted">
        點擊「修改商品」後，可直接在頁面上編輯資料。
      </p>

    </div>

  </div>


  <div class="product-actions">

    <button
      id="editProductButton"
      class="secondary-button"
      type="button"
    >
      修改商品
    </button>

    <button
      class="primary-button"
      type="button"
      disabled
    >
      ＋ 入庫
    </button>

    <button
      class="danger-button"
      type="button"
      disabled
    >
      − 出庫
    </button>

  </div>

</section>


      <!-- 採購紀錄 -->

      <section class="panel">

        <div class="panel-heading">

          <div>

            <h2>
              採購紀錄
            </h2>

            <p
              id="purchaseCount"
              class="muted"
            >
              載入中...
            </p>

          </div>

        </div>


        <div
          id="purchaseList"
          class="record-list"
        >
        </div>

      </section>


      <!-- 庫存異動 -->

      <section class="panel">

        <div class="panel-heading">

          <div>

            <h2>
              庫存異動紀錄
            </h2>

            <p
              id="inventoryLogCount"
              class="muted"
            >
              載入中...
            </p>

          </div>

        </div>


        <div
          id="inventoryLogList"
          class="record-list"
        >
        </div>

      </section>

    </div>

  </main>


  <nav
    class="mobile-nav"
    aria-label="主要導覽"
  >

    <a
      href="index.html"
    >
      <span>⌂</span>
      首頁
    </a>

    <a
      href="admin.html"
    >
      <span>▦</span>
      管理
    </a>

  </nav>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>

  <script src="js/supabase.js"></script>

  <script src="js/products.js"></script>

  <script src="js/product.js"></script>

</body>

</html>
