<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <title>管理員登入｜倉管系統</title>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="index.html">
      <span class="brand-mark">W</span>
      <span>倉管系統</span>
    </a>
    <p class="eyebrow">ADMIN</p>
    <h1>管理員登入</h1>
    <p class="muted">登入後可以新增商品、上傳圖片及管理庫存。</p>
    <form id="loginForm" class="form-stack">
      <label>電子郵件<input id="email" type="email" required autocomplete="email"></label>
      <label>密碼<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="primary-button full-width" type="submit">登入</button>
      <p id="loginMessage" class="form-message" role="alert"></p>
    </form>
    <a class="text-link" href="index.html">← 回到商品頁</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
